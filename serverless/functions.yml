runPostDeploy:
  handler: dist/src/lambda-handlers/post-deploy.handler
  description: 'Runs migrations + seeds - invoked after deployment'
  timeout: 120
  memorySize: 512

api:
  handler: dist/src/lambda-handlers/api.handler
  timeout: 29
  memorySize: 1512
  events:
    - httpApi:
        method: ANY
        path: /{proxy+}
    - httpApi:
        method: ANY
        path: /

updateDuesCron:
  handler: dist/src/lambda-handlers/cron.handler
  description: 'Cron job to update dues - triggered by EventBridge every 2 hours'
  timeout: 300
  memorySize: 1512
  events:
    - schedule:
        rate: rate(2 hours)
        enabled: true
        description: 'Update dues cron job scheduled to run every 2 hours'
        input:
          source: '${self:service}'
          'detail-type': 'Scheduled Event'
          detail:
            job: 'updateDues'
            stage: '${self:provider.stage}'

closeExpiredLoansCron:
  handler: dist/src/lambda-handlers/cron.handler
  description: 'Cron job to close open loans after tenure end - triggered by EventBridge daily'
  timeout: 300
  memorySize: 1512
  events:
    - schedule:
        rate: cron(30 19 * * ? *)
        enabled: true
        description: 'Close expired loans daily at ~1:00 AM Asia/Kolkata (19:30 UTC previous calendar day)'
        input:
          source: '${self:service}'
          'detail-type': 'Scheduled Event'
          detail:
            job: 'closeExpiredLoans'
            stage: '${self:provider.stage}'

