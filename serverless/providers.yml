name: aws
runtime: nodejs20.x
stage: ${opt:stage, 'dev'}
region: ${opt:region, 'ap-south-1'}
memorySize: 512
timeout: 30
environment:
  NODE_ENV: ${self:provider.stage}
  AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
  SKIP_SEEDING: 'true' # Skip seeding in Lambda to avoid timeout on cold starts
  # Database configuration
  DB_HOST: ${env:DB_HOST, ''}
  DB_PORT: ${env:DB_PORT, '27017'}
  DB_USERNAME: ${env:DB_USERNAME, ''}
  DB_USER: ${env:DB_USER, ''}
  DB_PASSWORD: ${env:DB_PASSWORD, ''}
  DB_PASS: ${env:DB_PASS, ''}
  DB_NAME: ${env:DB_NAME, 'jobs_db'}
  # JWT configuration
  TOKEN_SECRET: ${env:TOKEN_SECRET, 'dev-secret'}
  TOKEN_AUDIENCE: ${env:TOKEN_AUDIENCE, 'usersAudience'}
  TOKEN_ISSUER: ${env:TOKEN_ISSUER, 'UsersIssuer'}
  TOKEN_ALG: ${env:TOKEN_ALG, 'HS256'}
  # AES encryption
  AES_KEY: ${env:AES_KEY, ''}
  AES_ALGORITHM: ${env:AES_ALGORITHM, 'aes-256-cbc'}
  # AWS S3 configuration
  S3_AWS_ACCESS_KEY_ID: ${env:S3_AWS_ACCESS_KEY_ID, ''}
  S3_AWS_SECRET_ACCESS_KEY: ${env:S3_AWS_SECRET_ACCESS_KEY, ''}
  S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, 'jobs-file-storage'}
  S3_BUCKET_REGION: ${env:S3_BUCKET_REGION, 'ap-south-1'}
  # Lambda configuration
  LAMBDA_AWS_REGION: ${env:LAMBDA_AWS_REGION, ''}
  LAMBDA_AWS_ACCESS_KEY_ID: ${env:LAMBDA_AWS_ACCESS_KEY_ID, ''}
  LAMBDA_AWS_SECRET_ACCESS_KEY: ${env:LAMBDA_AWS_SECRET_ACCESS_KEY, ''}
  # AI configuration
  AI_OPENAI_API_KEY: ${env:AI_OPENAI_API_KEY, ''}
  AI_GEMINI_API_KEY: ${env:AI_GEMINI_API_KEY, ''}
  AI_CLAUDE_API_KEY: ${env:AI_CLAUDE_API_KEY, ''}
  # Twilio configuration
  TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID, ''}
  TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN, ''}
  TWILIO_PHONE_NUMBER: ${env:TWILIO_PHONE_NUMBER, ''}
  # Web app domain
  WEB_APP_DOMAIN: ${env:WEB_APP_DOMAIN, ''}
  # Mock storage flag
  MOCK_STORAGE: ${env:MOCK_STORAGE, ''}
httpApi:
  cors: true
iam:
  role:
    statements:
      - Effect: Allow
        Action:
          - events:PutRule
          - events:PutTargets
          - events:RemoveTargets
          - events:DeleteRule
          - events:DescribeRule
          - events:ListRules
          - events:ListTargetsByRule
        Resource: '*'
      - Effect: Allow
        Action:
          - lambda:InvokeFunction
          - lambda:GetFunction
        Resource: '*'
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource: 'arn:aws:sqs:*:*:*'
      - Effect: Allow
        Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
        Resource: 'arn:aws:logs:*:*:*'
      - Effect: Allow
        Action:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:ListBucket
          - s3:GetObjectVersion
        Resource:
          - 'arn:aws:s3:::*'
          - 'arn:aws:s3:::*/*'
