name: aws
runtime: nodejs20.x
stage: ${opt:stage, 'dev'}
region: ${opt:region, 'ap-south-1'}
memorySize: 512
timeout: 30
logRetentionInDays: 30
# Lambda must be in the same VPC as RDS to reach private RDS (PubliclyAccessible: false)

# vpc is not needed because the lambda is in the same VPC as the RDS instance
# vpc:
#   securityGroupIds:
#     - !Ref LambdaSecurityGroup
#   subnetIds:
#     - !Ref PublicSubnet1
#     - !Ref PublicSubnet2
environment:
  NODE_ENV: ${self:provider.stage}
  NO_COLOR: 'true'
  AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
  # !Ref RDS returns the instance id, not the hostname — use Endpoint for clients
  DB_HOST: !GetAtt RdsInstance.Endpoint.Address
  DB_PORT: !GetAtt RdsInstance.Endpoint.Port
  DB_NAME: ${env:DB_NAME, 'byajbazaar_db'}
  DB_USER: ${env:DB_MASTER_USERNAME, 'postgres'}
  DB_PASS: ${env:DB_MASTER_PASSWORD}
  AI_PROVIDER: ${env:AI_PROVIDER, 'bedrock'}
  GEMINI_API_KEYS: ${env:GEMINI_API_KEYS, ''}
  BEDROCK_MODEL_ID: ${env:BEDROCK_MODEL_ID, 'global.amazon.nova-2-lite-v1:0'}
  BEDROCK_AWS_REGION: ${env:BEDROCK_AWS_REGION, 'ap-south-1'}
  EVENTS_SYNC_SECRET: ${env:EVENTS_SYNC_SECRET, ''}
  TRY_ON_PROVIDER: ${env:TRY_ON_PROVIDER, ''}
  TRYON_API_BASE_URL: ${env:TRYON_API_BASE_URL, ''}
  TRYON_API_TIMEOUT_MS: ${env:TRYON_API_TIMEOUT_MS, '90000'}
  TRYON_API_MAX_RETRIES: ${env:TRYON_API_MAX_RETRIES, '2'}
  CLOUDFLARE_ACCOUNT_ID: ${env:CLOUDFLARE_ACCOUNT_ID, ''}
  CLOUDFLARE_API_TOKEN: ${env:CLOUDFLARE_API_TOKEN, ''}
  CLOUDFLARE_TRYON_MODEL: ${env:CLOUDFLARE_TRYON_MODEL, '@cf/black-forest-labs/flux-2-klein-9b'}
  CLOUDFLARE_TRYON_TIMEOUT_MS: ${env:CLOUDFLARE_TRYON_TIMEOUT_MS, '180000'}
  CLOUDFLARE_TRYON_MAX_RETRIES: ${env:CLOUDFLARE_TRYON_MAX_RETRIES, '2'}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${env:CLOUDFLARE_R2_ACCESS_KEY_ID, ''}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${env:CLOUDFLARE_R2_SECRET_ACCESS_KEY, ''}
  CLOUDFLARE_R2_ENDPOINT: ${env:CLOUDFLARE_R2_ENDPOINT, ''}
  CLOUDFLARE_R2_BUCKET: ${env:CLOUDFLARE_R2_BUCKET, ''}
  TRY_ON_LAMBDA_NAME:
    Ref: JewelleryTryOnLambdaFunction
  # Use CloudFormation Refs only inside Fn::Join — ${aws:region}/${sls:stage} break Serverless variable resolution
  WEBSOCKET_API_ENDPOINT:
    Fn::Join:
      - ''
      - - 'https://'
        - Ref: WebsocketsApi
        - '.execute-api.'
        - Ref: AWS::Region
        - '.amazonaws.com/'
        - ${self:provider.stage}
  WEBSOCKET_API_URL:
    Fn::Join:
      - ''
      - - 'wss://'
        - Ref: WebsocketsApi
        - '.execute-api.'
        - Ref: AWS::Region
        - '.amazonaws.com/'
        - ${self:provider.stage}
httpApi:
  cors: true
websocket:
  useProviderTags: true
  # Route by message body.action is handled via named routes + wsDefault ($default) in functions.yml.
  # provider.websocket.routeSelectionExpression is not a valid Serverless Framework property.
iam:
  role:
    statements:
      - Effect: Allow
        Action:
          - events:PutRule
          - events:PutTargets
          - events:RemoveTargets
          - events:DeleteRule
          - events:DescribeRule
          - events:ListRules
          - events:ListTargetsByRule
        Resource: '*'
      - Effect: Allow
        Action:
          - lambda:InvokeFunction
          - lambda:GetFunction
        Resource: '*'
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource: 'arn:aws:sqs:*:*:*'
      - Effect: Allow
        Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
        Resource: 'arn:aws:logs:*:*:*'
      - Effect: Allow
        Action:
          - execute-api:ManageConnections
        Resource:
          - arn:aws:execute-api:${aws:region}:${aws:accountId}:*/${sls:stage}/POST/@connections/*
      - Effect: Allow
        Action:
          - bedrock:InvokeModel
          - bedrock:InvokeModelWithResponseStream
        Resource: '*'
      - Effect: Allow
        Action:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:ListBucket
          - s3:GetObjectVersion
        Resource:
          - 'arn:aws:s3:::*'
          - 'arn:aws:s3:::*/*'
      - Effect: Allow
        Action:
          - states:StartExecution
          - states:DescribeExecution
          - states:StopExecution
        Resource: '*'
