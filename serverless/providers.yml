name: aws
runtime: nodejs20.x
stage: ${opt:stage, 'dev'}
region: ${opt:region, 'ap-south-1'}
memorySize: 512
timeout: 30
logRetentionInDays: 30
# Lambda must be in the same VPC as RDS to reach private RDS (PubliclyAccessible: false)

# vpc is not needed because the lambda is in the same VPC as the RDS instance
# vpc:
#   securityGroupIds:
#     - !Ref LambdaSecurityGroup
#   subnetIds:
#     - !Ref PublicSubnet1
#     - !Ref PublicSubnet2
environment:
  NODE_ENV: ${self:provider.stage}
  NO_COLOR: 'true'
  AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
  # !Ref RDS returns the instance id, not the hostname — use Endpoint for clients
  DB_HOST: !GetAtt RdsInstance.Endpoint.Address
  DB_PORT: !GetAtt RdsInstance.Endpoint.Port
  DB_NAME: ${env:DB_NAME, 'byajbazaar_db'}
  DB_USER: ${env:DB_MASTER_USERNAME, 'postgres'}
  DB_PASS: ${env:DB_MASTER_PASSWORD}
httpApi:
  cors: true
iam:
  role:
    statements:
      - Effect: Allow
        Action:
          - events:PutRule
          - events:PutTargets
          - events:RemoveTargets
          - events:DeleteRule
          - events:DescribeRule
          - events:ListRules
          - events:ListTargetsByRule
        Resource: '*'
      - Effect: Allow
        Action:
          - lambda:InvokeFunction
          - lambda:GetFunction
        Resource: '*'
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource: 'arn:aws:sqs:*:*:*'
      - Effect: Allow
        Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
        Resource: 'arn:aws:logs:*:*:*'
      - Effect: Allow
        Action:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:ListBucket
          - s3:GetObjectVersion
        Resource:
          - 'arn:aws:s3:::*'
          - 'arn:aws:s3:::*/*'
