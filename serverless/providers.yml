name: aws
runtime: nodejs20.x
stage: ${opt:stage, 'dev'}
region: ${opt:region, 'ap-south-1'}
memorySize: 512
timeout: 30
logRetentionInDays: 30
environment:
  # Only these few live in the Lambda environment (AWS caps it at 4 KB). Every other setting comes from
  # .env.<stage> through the SSM parameters /byajbazaar/<stage>/app-config/1..3, marketing-config and logs-config
  # (serverless.yml resources), loaded on cold start — see libs/aws/app-settings.loader.ts.
  NODE_ENV: ${self:provider.stage}
  NO_COLOR: 'true'
  AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
  # Literal / env only — Ref/GetAtt here creates a circular dependency with WebsocketsApi.
  TRY_ON_LAMBDA_NAME: ${self:service}-${sls:stage}-jewelleryTryOn
  GOOGLE_PLAY_SERVICE_ACCOUNT_SSM_PATH: /byajbazaar/${sls:stage}/google-play-service-account-json
httpApi:
  # Same as `cors: true` (Serverless defaults), plus X-Shop-Id: the shop a signed-in person works in.
  cors:
    allowedOrigins:
      - '*'
    allowedHeaders:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
      - X-Amzn-Trace-Id
      - X-Shop-Id
    allowedMethods:
      - OPTIONS
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
websocket:
  useProviderTags: true
  # Route by message body.action is handled via named routes + wsDefault ($default) in functions.yml.
  # provider.websocket.routeSelectionExpression is not a valid Serverless Framework property.
iam:
  role:
    statements:
      - Effect: Allow
        Action:
          - events:PutRule
          - events:PutTargets
          - events:RemoveTargets
          - events:DeleteRule
          - events:DescribeRule
          - events:ListRules
          - events:ListTargetsByRule
        Resource: '*'
      - Effect: Allow
        Action:
          - lambda:InvokeFunction
          - lambda:GetFunction
        Resource: '*'
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource: 'arn:aws:sqs:*:*:*'
      - Effect: Allow
        Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
        Resource: 'arn:aws:logs:*:*:*'
      - Effect: Allow
        Action:
          - execute-api:ManageConnections
        Resource:
          - arn:aws:execute-api:${aws:region}:${aws:accountId}:*/${sls:stage}/POST/@connections/*
      - Effect: Allow
        Action:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:ListBucket
          - s3:GetObjectVersion
        Resource:
          - 'arn:aws:s3:::*'
          - 'arn:aws:s3:::*/*'
      - Effect: Allow
        Action:
          - ssm:GetParameter
          - ssm:GetParameters
        Resource:
          - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/byajbazaar/*
