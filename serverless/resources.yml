Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  VpcIdSsmParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.ssmVpcParams.vpcId}
      Type: String
      Description: VPC ID for byajbazaar (${sls:stage})
      Value: !Ref Vpc

  SubnetIdsSsmParameter:
    Type: AWS::SSM::Parameter
    DependsOn:
      - PublicSubnet1
      - PublicSubnet2
    Properties:
      Name: ${self:custom.ssmVpcParams.subnetIds}
      Type: String
      Description: Comma-separated subnet IDs (${sls:stage})
      Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda for RDS access
      VpcId: !Ref Vpc

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-postgres
      DBInstanceClass: db.t3.micro
      Engine: postgres
      # EngineVersion: '16.9'
      AllocatedStorage: 20
      StorageEncrypted: true
      MasterUsername: postgres
      MasterUserPassword: ${env:DB_MASTER_PASSWORD}
      DBName: byajbazaar_db
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      PubliclyAccessible: true

  # Monthly jewellery-events sync: EventBridge → Step Functions Map (per state) → Merge Lambda
  JewelleryEventsStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JewelleryEventsStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt EventsFetchStateLambdaFunction.Arn
                  - !GetAtt EventsMergeLambdaFunction.Arn

  JewelleryEventsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-jewellery-events-sync
      RoleArn: !GetAtt JewelleryEventsStateMachineRole.Arn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Monthly jewellery events sync via Gemini (parallel by state)",
              "StartAt": "FetchStatesParallel",
              "States": {
                "FetchStatesParallel": {
                  "Type": "Map",
                  "ItemsPath": "$",
                  "MaxConcurrency": 3,
                  "Iterator": {
                    "StartAt": "FetchStateEvents",
                    "States": {
                      "FetchStateEvents": {
                        "Type": "Task",
                        "Resource": "${FetchArn}",
                        "Parameters": {
                          "state.$": "$"
                        },
                        "End": true
                      }
                    }
                  },
                  "Next": "MergeAndSave"
                },
                "MergeAndSave": {
                  "Type": "Task",
                  "Resource": "${MergeArn}",
                  "End": true
                }
              }
            }
          - FetchArn: !GetAtt EventsFetchStateLambdaFunction.Arn
            MergeArn: !GetAtt EventsMergeLambdaFunction.Arn

