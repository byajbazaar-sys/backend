Resources:
  # Monthly jewellery-events sync: EventBridge → Step Functions Map (per state) → Merge Lambda
  JewelleryEventsStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JewelleryEventsStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt EventsFetchStateLambdaFunction.Arn
                  - !GetAtt EventsMergeLambdaFunction.Arn

  JewelleryEventsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-jewellery-events-sync
      RoleArn: !GetAtt JewelleryEventsStateMachineRole.Arn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Monthly jewellery events sync via Gemini (parallel by state)",
              "StartAt": "FetchStatesParallel",
              "States": {
                "FetchStatesParallel": {
                  "Type": "Map",
                  "ItemsPath": "$",
                  "MaxConcurrency": 3,
                  "Iterator": {
                    "StartAt": "FetchStateEvents",
                    "States": {
                      "FetchStateEvents": {
                        "Type": "Task",
                        "Resource": "${FetchArn}",
                        "Parameters": {
                          "state.$": "$"
                        },
                        "End": true
                      }
                    }
                  },
                  "Next": "MergeAndSave"
                },
                "MergeAndSave": {
                  "Type": "Task",
                  "Resource": "${MergeArn}",
                  "End": true
                }
              }
            }
          - FetchArn: !GetAtt EventsFetchStateLambdaFunction.Arn
            MergeArn: !GetAtt EventsMergeLambdaFunction.Arn

  # JewelleryEventsSyncScheduleRole + JewelleryEventsMonthlySchedule: add when enabling
  # the monthly EventBridge trigger (keep out of the template until then to avoid
