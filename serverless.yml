service: byajbazaar-backend

frameworkVersion: '3'
useDotenv: true
provider: ${file(serverless/providers.yml)}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-plugin-common-excludes
  - serverless-plugin-include-dependencies

custom:
  # useDotenv + serverless-dotenv-plugin: file must match stage (.env.{stage})
  dotenvPathByStage:
    production: .env.production
    staging: .env.staging
    dev: .env.dev
  dotenv:
    path: ${self:custom.dotenvPathByStage.${sls:stage}}
    # DB_* vars come from .env.{stage} (Neon / external Postgres).
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3002
    noPrependStageInUrl: true
    noAuth: true
    # Increase timeout for serverless-offline to match function timeout
    timeout: 29
  includeDependencies:
    enableCaching: true
functions: ${file(serverless/functions.yml)}

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!libs/**'
    - '!scripts/**'
    - '!*.md'
    - '!serverless/**'
    - '!tsconfig*.json'
    - '!nest-cli.json'
    - '!eslint.config.mjs'
    - '!.git/**'
    - '!node_modules/aws-sdk/**'
    - 'dist/**'
    - 'package.json'
