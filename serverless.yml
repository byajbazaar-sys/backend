service: byajbazaar-backend

frameworkVersion: '3'
provider: ${file(serverless/providers.yml)}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  dotenv:
    path: .env
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    noAuth: true
    # Increase timeout for serverless-offline to match function timeout
    timeout: 29

functions: ${file(serverless/functions.yml)}

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!libs/**'
    - '!scripts/**'
    - '!*.md'
    - '!serverless/**'
    - '!tsconfig*.json'
    - '!nest-cli.json'
    - '!eslint.config.mjs'
    - '!.git/**'
    - 'dist/**'
    - 'node_modules/**'
    - 'package.json'
    - 'package-lock.json'
    - 'yarn.lock'
