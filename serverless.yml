service: byajbazaar-backend

frameworkVersion: '3'
useDotenv: true
provider: ${file(serverless/providers.yml)}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-plugin-common-excludes
  - serverless-plugin-include-dependencies

custom:
  # useDotenv + serverless-dotenv-plugin: file must match stage (.env.{stage})
  dotenvPathByStage:
    production: .env.production
    staging: .env.staging
    dev: .env.dev
  dotenv:
    path: ${self:custom.dotenvPathByStage.${sls:stage}}
    # Nothing from .env.{stage} goes into the Lambda environment (AWS caps it at 4 KB; a deploy failed at 4190 bytes).
    # The settings go to SSM parameters instead and are loaded on cold start:
    #   app-config/1..3  every other key   (serverless/app-config.js → libs/aws/app-settings.loader.ts)
    #   marketing-config MARKETING_* / KAGGLE_* (serverless/marketing-config.js)
    #   logs-config      LOGS_DB_*          (serverless/logs-config.js)
    #   ai-config        AI_* (serverless/ai-config.js)
    # A new setting needs no change here: add it to .env.{stage} and redeploy.
    include: []
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3002
    noPrependStageInUrl: true
    noAuth: true
    # Increase timeout for serverless-offline to match function timeout
    timeout: 29
  includeDependencies:
    enableCaching: true
functions: ${file(serverless/functions.yml)}

resources:
  Resources:
    # Every other app setting from .env.${sls:stage}, in up to 3 JSON chunks of 4 KB (serverless/app-config.js), read by
    # every Lambda on cold start before Nest starts (libs/aws/app-settings.loader.ts). An empty chunk is "{}".
    AppConfigParameter1:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/app-config/1
        Type: String
        Tier: Standard
        Description: App settings (JSON, part 1) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/app-config.js):part1}
    AppConfigParameter2:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/app-config/2
        Type: String
        Tier: Standard
        Description: App settings (JSON, part 2) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/app-config.js):part2}
    AppConfigParameter3:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/app-config/3
        Type: String
        Tier: Standard
        Description: App settings (JSON, part 3) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/app-config.js):part3}
    # Marketing / Kaggle settings, read by every Lambda on cold start (keeps them out of the 4 KB Lambda env).
    MarketingConfigParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/marketing-config
        Type: String
        Tier: Standard
        Description: Marketing videos settings (JSON) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/marketing-config.js)}
    # Logs database settings (LOGS_DB_*), read by every Lambda on cold start. Empty JSON = logs stay in the main DB.
    LogsConfigParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/logs-config
        Type: String
        Tier: Standard
        Description: Logs database settings (JSON) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/logs-config.js)}
    # ByajBazaar AI settings (AI_*), read by every Lambda on cold start. Empty JSON = fallbacks.
    AiConfigParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/ai-config
        Type: String
        Tier: Standard
        Description: ByajBazaar AI settings (JSON) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/ai-config.js)}

  # Every function waits for the settings parameters, so no cold start ever runs without them during a deploy.
  extensions:
    RunPostDeployLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    ApiLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    UpdateDuesCronLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    CloseExpiredLoansCronLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    RelayLogsCronLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsConnectLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsDisconnectLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsCreateSessionLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsJoinSessionLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsBarcodeScannedLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsCartUpdatedLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsHeartbeatLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsLeaveSessionLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsMarketingProgressLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    WsDefaultLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    JewelleryTryOnLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    MarketingWorkerLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]
    MarketingPublisherLambdaFunction:
      DependsOn: [AppConfigParameter1, AppConfigParameter2, AppConfigParameter3, MarketingConfigParameter, LogsConfigParameter, AiConfigParameter]

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!libs/**'
    - '!scripts/**'
    - '!*.md'
    - '!serverless/**'
    - '!tsconfig*.json'
    - '!nest-cli.json'
    - '!eslint.config.mjs'
    - '!.git/**'
    - '!node_modules/aws-sdk/**'
    - 'dist/**'
    - 'package.json'
