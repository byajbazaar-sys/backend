service: byajbazaar-backend

frameworkVersion: '3'
useDotenv: true
provider: ${file(serverless/providers.yml)}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-plugin-common-excludes
  - serverless-plugin-include-dependencies

custom:
  # Populated by CloudFormation from created VPC/subnets (see resources.yml)
  ssmVpcParams:
    vpcId: /byajbazaar/${sls:stage}/vpc-id
    subnetIds: /byajbazaar/${sls:stage}/subnet-ids
  # serverless-dotenv-plugin loads this file before deploy; map production → .env.prod
  dotenvPathByStage:
    production: .env.prod
    staging: .env
    dev: .env
  dotenv:
    path: ${self:custom.dotenvPathByStage.${sls:stage}}
        # Keep RDS connection from CloudFormation (!GetAtt), not .env
    # exclude:
    #   - DB_HOST
    #   - DB_PORT
    # DB_HOST/DB_PORT must come from .env for serverless-offline (!GetAtt is unresolved locally).
    # When set in .env, dotenv overrides provider.environment and wins over CloudFormation refs.
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3002
    noPrependStageInUrl: true
    noAuth: true
    # Increase timeout for serverless-offline to match function timeout
    timeout: 29
  includeDependencies:
    enableCaching: true
functions: ${file(serverless/functions.yml)}

resources: ${file(serverless/resources.yml)}

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!libs/**'
    - '!scripts/**'
    - '!*.md'
    - '!serverless/**'
    - '!tsconfig*.json'
    - '!nest-cli.json'
    - '!eslint.config.mjs'
    - '!.git/**'
    - '!node_modules/aws-sdk/**'
    - 'dist/**'
    - 'package.json'
