service: byajbazaar-backend

frameworkVersion: '3'
useDotenv: true
provider: ${file(serverless/providers.yml)}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-plugin-common-excludes
  - serverless-plugin-include-dependencies

custom:
  # useDotenv + serverless-dotenv-plugin: file must match stage (.env.{stage})
  dotenvPathByStage:
    production: .env.production
    staging: .env.staging
    dev: .env.dev
  dotenv:
    path: ${self:custom.dotenvPathByStage.${sls:stage}}
    # DB_* vars come from .env.{stage} (Neon / external Postgres).
    # Large secrets stay out of Lambda env (4 KB limit); loaded at runtime from SSM instead.
    exclude:
      - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
      # Marketing / Kaggle settings go to the SSM parameter below instead (serverless/marketing-config.js).
      - MARKETING_CREDENTIALS_SECRET
      # No longer read: Kaggle accounts are managed in the admin screen (kaggle_credentials). Never ship these keys.
      - KAGGLE_WORKERS
      - KAGGLE_WORKER_CONCURRENCY
      - KAGGLE_SESSION_HOURS
      - KAGGLE_MACHINE_SHAPE
      - MARKETING_WORKER_SECRET
      - MARKETING_API_BASE_URL
      - MARKETING_INLINE
      - MARKETING_DB_HOST
      - MARKETING_DB_PORT
      - MARKETING_DB_NAME
      - MARKETING_DB_USER
      - MARKETING_DB_PASS
      - MARKETING_S3_AWS_ACCESS_KEY_ID
      - MARKETING_S3_AWS_SECRET_ACCESS_KEY
      - MARKETING_S3_BUCKET_NAME
      - MARKETING_S3_BUCKET_REGION
      - MARKETING_S3_ENDPOINT
      - MARKETING_QSTASH_URL
      - MARKETING_QSTASH_TOKEN
      - MARKETING_QSTASH_CURRENT_SIGNING_KEY
      - MARKETING_QSTASH_NEXT_SIGNING_KEY
      - CLOUDFLARE_TEXT_MODEL
      # Logs database settings go to their own SSM parameter (serverless/logs-config.js).
      - LOGS_DB_HOST
      - LOGS_DB_PORT
      - LOGS_DB_NAME
      - LOGS_DB_USER
      - LOGS_DB_PASS
      - LOGS_DB_CONNECT_TIMEOUT_MS
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3002
    noPrependStageInUrl: true
    noAuth: true
    # Increase timeout for serverless-offline to match function timeout
    timeout: 29
  includeDependencies:
    enableCaching: true
functions: ${file(serverless/functions.yml)}

resources:
  Resources:
    # Marketing / Kaggle settings, read by every Lambda on cold start (keeps them out of the 4 KB Lambda env).
    MarketingConfigParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/marketing-config
        Type: String
        Tier: Standard
        Description: Marketing videos settings (JSON) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/marketing-config.js)}
    # Logs database settings (LOGS_DB_*), read by every Lambda on cold start. Empty JSON = logs stay in the main DB.
    LogsConfigParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /byajbazaar/${sls:stage}/logs-config
        Type: String
        Tier: Standard
        Description: Logs database settings (JSON) - generated from .env.${sls:stage} on deploy
        Value: ${file(./serverless/logs-config.js)}

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!libs/**'
    - '!scripts/**'
    - '!*.md'
    - '!serverless/**'
    - '!tsconfig*.json'
    - '!nest-cli.json'
    - '!eslint.config.mjs'
    - '!.git/**'
    - '!node_modules/aws-sdk/**'
    - 'dist/**'
    - 'package.json'
